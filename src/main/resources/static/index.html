<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Voting System - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>E-Voting System</h1>

        <p class="subtitle">
            Secure & Transparent Digital Election
        </p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
            >

            <label for="password">Password</label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>


<script>

    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        message.style.color = "#1e3c72";
        message.innerText = "Logging in...";

        loginButton.disabled = true;
        loginButton.innerText = "Logging in...";

        try {

            const response = await fetch("/api/users/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });


            const responseText = await response.text();

            console.log("Status:", response.status);
            console.log("Response:", responseText);


            if (response.ok) {

                const user = JSON.parse(responseText);

                localStorage.setItem("user", JSON.stringify(user));

                message.style.color = "green";
                message.innerText = "Login successful! Redirecting...";


                if (user.role === "ADMIN") {

                    setTimeout(function() {
                        window.location.href = "admin-dashboard.html";
                    }, 1000);

                } else {

                    setTimeout(function() {
                        window.location.href = "voter-dashboard.html";
                    }, 1000);

                }

            } else {

                message.style.color = "red";
                message.innerText = responseText || "Invalid email or password.";

                loginButton.disabled = false;
                loginButton.innerText = "Login";

            }

        } catch (error) {

            console.error("Login error:", error);

            message.style.color = "red";
            message.innerText = "Unable to connect to the server.";

            loginButton.disabled = false;
            loginButton.innerText = "Login";

        }

    });

</script>

</body>

</html>
